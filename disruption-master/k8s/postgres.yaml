# Storage for the Disruption Management System's Postgres.
#
# The database itself is not a separate workload: it runs as a localhost-only
# sidecar next to the app, in k8s/deployment.yaml. Only the volumes live here.
#
# Why a sidecar and not a StatefulSet with a Service:
#  - Nothing outside the pod ever needs to reach the database, and Postgres is
#    started with listen_addresses=127.0.0.1, so it is not on the pod network at
#    all. A Service would be an attack surface with no user.
#  - The password is generated inside the cluster by an init container and kept
#    on this volume. It is never in this repository, never in a manifest, and
#    never passes through a tool call - so there is also no Secret to create by
#    hand, and no step for an operator to get wrong.
#
# There is no password in this file, and there must never be one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blinkit-disruption-dbdata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Dumps land on their own claim: a volume that fills with backups must not be
# the same one that would then stop Postgres from accepting writes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blinkit-disruption-dbbackup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
