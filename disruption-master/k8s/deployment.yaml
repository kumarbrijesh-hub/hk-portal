apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blinkit-disruption-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blinkit-disruption
spec:
  replicas: 1
  strategy:
    # RWO volume: the old pod must release the claim before the new one mounts it.
    type: Recreate
  selector:
    matchLabels:
      app: blinkit-disruption
  template:
    metadata:
      labels:
        app: blinkit-disruption
    spec:
      containers:
        - name: blinkit-disruption
          image: 501578625374.dkr.ecr.ap-south-1.amazonaws.com/chef/blinkit-apps-kumarbrijesh/blinkit-disruption/blinkit-disruption
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: "/data"
            - name: TZ
              value: "Asia/Kolkata"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: blinkit-disruption-data
---
apiVersion: v1
kind: Service
metadata:
  name: blinkit-disruption
spec:
  selector:
    app: blinkit-disruption
  ports:
    - port: 8080
      targetPort: 8080
